services:
  audiobookshelf:
    container_name: audiobookshelf
    # `latest` is the stable channel. advplyr publishes no rolling major tag
    # (`2` and `2.35` do not exist), so it is this or an exact version. Rolling by
    # choice — Komodo polls for updates but never applies them automatically
    # (auto_update=false).
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    ports:
      - "13378:80"
    volumes:
      - /opt/audiobookshelf/audiobooks:/audiobooks
      - /opt/audiobookshelf/podcasts:/podcasts
      - /opt/audiobookshelf/config:/config
      - /opt/audiobookshelf/metadata:/metadata
    environment:
      TZ: ${TZ}
