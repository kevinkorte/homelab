# InfluxDB + Grafana + UniFi Poller.
#
# These three must stay in one stack. Grafana's stored datasource and unpoller's
# UP_INFLUXDB_URL both address InfluxDB as http://influxdb:8086 — by container
# name — so splitting them would need an explicit shared network for no benefit.
services:
  influxdb:
    # Frozen deliberately, unlike the app stacks. UniFi Poller requires InfluxDB
    # 1.x, and 1.8 is end-of-life, so there is nothing newer to track on this line.
    image: influxdb:1.8.10
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-storage:/var/lib/influxdb
    environment:
      # Literals, not Variables, and deliberately so: the value `unpoller` is a
      # substring of the image name ghcr.io/unpoller/unpoller. If it were ever a
      # Komodo *secret*, Komodo would redact it out of image and container names
      # and report the stack as Down while it ran fine. (Spec R6.)
      INFLUXDB_DB: unpoller
      INFLUXDB_ADMIN_USER: unpoller
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
      INFLUXDB_ADMIN_USER_ENABLED: "false"
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
    # Added during migration. Both dependants below previously used a bare
    # depends_on, which waits only for the container to start — same bug traccar
    # had. Verified this check fails correctly against an unreachable port.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      # Both are read only when Grafana initialises an empty database. The
      # existing grafana-storage already has an admin user, so these are inert
      # today — kept so a rebuild from scratch is not left wide open.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      # Angular panels removed — unsupported on current Grafana; UniFi dashboards use clock panel
      GF_INSTALL_PLUGINS: grafana-clock-panel

  unifi-poller:
    # Pinned to major v3 rather than latest. unpoller v4 may drop InfluxDB 1.x
    # support, which would silently stop metrics collection against the 1.8
    # instance above. Minor and patch releases still roll.
    image: ghcr.io/unpoller/unpoller:v3
    container_name: unifi-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      UP_INFLUXDB_DB: unpoller
      UP_INFLUXDB_USER: unpoller
      UP_INFLUXDB_PASS: ${INFLUXDB_ADMIN_PASSWORD}
      UP_INFLUXDB_URL: http://influxdb:8086
      UP_UNIFI_DEFAULT_USER: ${UNIFI_USER}
      UP_UNIFI_DEFAULT_PASS: ${UNIFI_PASS}
      UP_UNIFI_DEFAULT_URL: ${UNIFI_URL}
      UP_POLLER_DEBUG: "false"
      UP_UNIFI_DEFAULT_SAVE_DPI: "false"
      UP_PROMETHEUS_NAMESPACE: unpoller

volumes:
  # ⚠️  BOTH MUST STAY external WITH THESE EXACT NAMES. (Spec R1.)
  #
  # They were created in May 2025 under the old `opt` compose project, so their
  # real names carry that prefix. Drop `external` and Compose silently creates
  # empty monitoring_influxdb-storage / monitoring_grafana-storage instead —
  # 25 GB of UniFi history and every Grafana dashboard would appear to vanish.
  influxdb-storage:
    external: true
    name: opt_influxdb-storage
  grafana-storage:
    external: true
    name: opt_grafana-storage
