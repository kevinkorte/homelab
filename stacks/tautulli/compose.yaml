services:
  tautulli:
    # `latest` is Tautulli's stable channel — `beta` and `nightly` are published
    # separately. Rolling by choice: Komodo polls for updates but never applies
    # them automatically (auto_update=false).
    #
    # Note this stack was digest-pinned at migration time to avoid a silent
    # upgrade; moving to `latest` means the next deploy WILL jump forward from
    # the old build (git c7153deb) to current.
    image: ghcr.io/tautulli/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      TZ: ${TZ}
    volumes:
      - /opt/tautulli/config:/config
    # No depends_on plex. Tautulli is a separate stack precisely so it can be
    # updated without restarting Plex. It reaches Plex over the host network at
    # the address in its own config.ini (pms_ip), not by container name, so there
    # is no compose-level dependency to preserve.
