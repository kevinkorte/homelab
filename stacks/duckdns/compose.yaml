services:
  duckdns:
    # `latest` is LinuxServer's stable channel (`develop` is the unstable one).
    # LSIO publishes no semver tags, only `latest` plus immutable build tags.
    # Rolling by choice — Komodo polls for updates but never applies them
    # automatically (auto_update=false).
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    network_mode: host
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      # Both come from Komodo Variables. SUBDOMAINS is not a credential, but it is
      # the public hostname — published beside a full service inventory it becomes a
      # targeted map, so it stays out of this public repo (spec decision D5).
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      UPDATE_IP: ipv4
      LOG_FILE: "false"
    volumes:
      - /opt/duckdns/config:/config
