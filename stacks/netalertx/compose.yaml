services:
  netalertx:
    container_name: netalertx
    # `latest` is the stable channel. Deliberately not `26`: NetAlertX uses CalVer,
    # so a year tag would roll through 2026 and then silently stop updating in
    # January 2027 with no signal. Rolling by choice — Komodo polls for updates but
    # never applies them automatically (auto_update=false).
    image: ghcr.io/netalertx/netalertx:latest
    network_mode: host
    read_only: true
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    # sysctls require NET_ADMIN on host namespace; set on host if needed:
    # sudo sysctl -w net.ipv4.conf.all.arp_ignore=1 net.ipv4.conf.all.arp_announce=2
    volumes:
      - /opt/netalertx:/data
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      # uid/gid 20211 matches the ownership of /opt/netalertx on the host.
      - "/tmp:uid=20211,gid=20211,mode=1700,rw,noexec,nosuid,nodev,async,noatime,nodiratime"
    environment:
      TZ: ${TZ}
      LISTEN_ADDR: 0.0.0.0
      PORT: "20211"
